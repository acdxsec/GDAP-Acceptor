name: Verify development companion
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MSCloudInternals/M365Internals
          ref: 21e8728b9491eda1c13e1e05ce03678ca75d64cc
          path: vendor/upstream
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check PowerShell prerequisite
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') { throw 'These tests require PowerShell 7.6 or newer.' }
          Write-Host "Testing commit $env:GITHUB_SHA with PowerShell $($PSVersionTable.PSVersion)"
      - name: Native URI contracts
        run: dotnet run --project src -- self-test
      - name: Local state and separate-process contracts
        run: dotnet run --project tests/StateContracts
      - name: Paste-in launcher workflow contracts
        run: dotnet run --project tests/LauncherContracts
      - name: Assemble development payload
        shell: pwsh
        run: ./tools/Build-Package.ps1 -Runtime '${{ matrix.runtime }}' -UpstreamSource ./vendor/upstream
      - name: Packaged browser, identity, approval and cancellation contracts
        shell: pwsh
        run: ./tools/Test-Acceptance.ps1 -ModulePath ./dist/${{ matrix.runtime }}/M365Internals/M365Internals.psd1 -ApprovalScript ./dist/${{ matrix.runtime }}/scripts/Approve-GdapRelationship.ps1
      - name: Packaged launcher-to-PowerShell handoff
        shell: pwsh
        run: ./tools/Test-Wrapper.ps1 -Wrapper ./dist/${{ matrix.runtime }}/scripts/Invoke-Acceptance.ps1
      - name: Isolated Windows Edge navigation (no sign-in)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe", "$env:ProgramFiles/Microsoft/Edge/Application/msedge.exe")
          $edge = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Edge is required for the isolated Windows browser check.' }
          ./tests/functions/Approve-GdapRelationship.BrowserTransport.Checks.ps1 -ModulePath ./dist/win-x64/M365Internals/M365Internals.psd1 -ApprovalScript ./dist/win-x64/scripts/Approve-GdapRelationship.ps1 -BrowserPath $edge
      - uses: actions/upload-artifact@v4
        with:
          name: development-only-${{ matrix.runtime }}
          path: dist/${{ matrix.runtime }}
          retention-days: 7
          if-no-files-found: error
      # Development artifacts only. No release or deployment step exists.
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: development-only-win-x64
          path: dist/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: development-only-linux-x64
          path: dist/linux-x64
      - name: Install open-source MSI authoring tools
        # Use the signed Ubuntu sources only. Unrelated runner repositories
        # (for example Chrome) must not affect this package-only tool install.
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y wixl msitools
      - name: Build unsigned installers and upgrade fixture
        shell: pwsh
        run: |
          ./tools/Build-Installers.ps1
          ./tools/Build-Installers.ps1 -Version 0.3.1 -OutputDirectory dist/upgrade-test
          ./tools/Test-Installers.ps1 -Directory dist/installers
          ./tools/Test-Installers.ps1 -Directory dist/upgrade-test -Version 0.3.1
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-development-installers
          path: |
            dist/installers/*.msi
            dist/installers/*.deb
            dist/upgrade-test/*.msi
          retention-days: 7
          if-no-files-found: error
  windows-installer:
    needs: package
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-development-installers
          path: dist
      - name: Isolated per-user installer lifecycle
        shell: pwsh
        run: ./tools/Test-WindowsInstaller.ps1 -Msi dist/installers/gdap-acceptor-0.3.0-x64.msi -UpgradeMsi dist/upgrade-test/gdap-acceptor-0.3.1-x64.msi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-logs
          path: ${{ runner.temp }}/gdap-msi-*.log
          retention-days: 7
